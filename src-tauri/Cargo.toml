[package]
name = "picglance"
version = "2.0.0"
edition = "2021"

[features]
first-image-diagnostic = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
picglance-compression = { path = "src/compression" }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
semver = "1"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
webview2-com = "0.39"
winreg = "0.56"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1"
