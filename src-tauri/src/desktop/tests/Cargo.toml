[package]
name = "picglance-desktop-tests"
version = "2.0.0"
edition = "2021"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[[test]]
name = "core"
path = "core.rs"
